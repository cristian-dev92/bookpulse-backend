name: Generate and Deploy Javadoc

on:
  push:
    branches:
      - main # Se ejecuta automáticamente cuando subes cambios a main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-javadoc:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate Javadoc
        run: mvn javadoc:javadoc -Ddoclint=none -DfailOnError=false -Dmaven.javadoc.failOnError=false -Dmaven.javadoc.failOnWarnings=false

      # Diagnóstico: muestra qué carpeta generó Maven antes de subirla
      - name: Verify Javadoc output
        run: |
          echo "-- target/reports/apidocs --"
          ls -la target/reports/apidocs || true
          echo "-- target/site/apidocs --"
          ls -la target/site/apidocs || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'target/site/apidocs' # Ruta estándar verificada: el plugin 3.6.3 genera aquí al invocar javadoc:javadoc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4