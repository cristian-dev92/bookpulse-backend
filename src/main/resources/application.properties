spring.application.name=bookpulse-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.threads.virtual.enabled=true

# --- Configuración SMTP (emails transaccionales) ---
# Compatible con Resend (smtp.resend.com:587) o Gmail. Las credenciales se leen
# desde variables de entorno para no exponer secretos en el repositorio.
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}
# Remitente configurable de los correos salientes
mail.from=${MAIL_FROM:onboarding@resend.dev}
# Destinatario admin para los avisos de nuevas reservas
booking.admin.email=${BOOKING_ADMIN_EMAIL:admin@demo.com}
# SOLO DEV: si se define, todos los correos al cliente se redirigen aquí
# (p. ej. cristianalh@gmail.com, cuenta verificada en el plan gratuito de Resend).
booking.test.to=${BOOKING_TEST_TO:}

# --- Configuración Stripe (Test Mode) ---
stripe.api.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success.url=${FRONTEND_URL:http://localhost:5173}/booking-success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel.url=${FRONTEND_URL:http://localhost:5173}/booking-cancel?session_id={CHECKOUT_SESSION_ID}

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
