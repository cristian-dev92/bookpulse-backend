spring.application.name=bookpulse-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.threads.virtual.enabled=true

# --- Configuración Resend (API REST de emails) ---
# Se usa la API REST (https://api.resend.com/emails) en lugar de SMTP para evitar
# timeouts del puerto 587. La clave se lee de variable de entorno.
resend.api.key=${RESEND_API_KEY:}
# Remitente de los correos salientes (formato "Nombre <email@dominio>")
mail.from=${MAIL_FROM:BookPulse <onboarding@resend.dev>}
# Destinatario admin para los avisos de nuevas reservas
booking.admin.email=${BOOKING_ADMIN_EMAIL:admin@demo.com}
# SOLO DEV: si se define, todos los correos al cliente se redirigen aquí
# (p. ej. cristianalh@gmail.com, cuenta verificada en el plan gratuito de Resend).
booking.test.to=${BOOKING_TEST_TO:}

# --- Configuración Stripe (Test Mode) ---
stripe.api.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success.url=${FRONTEND_URL:http://localhost:5173}/booking-success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel.url=${FRONTEND_URL:http://localhost:5173}/booking-cancel?session_id={CHECKOUT_SESSION_ID}

# --- Configuración Twilio (WhatsApp / SMS) ---
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.number=${TWILIO_WHATSAPP_NUMBER:whatsapp:+4915888623971}
twilio.sms.number=${TWILIO_SMS_NUMBER:}
# Prefijo de país por defecto cuando el teléfono del cliente no incluye el '+XX'
twilio.default.country.code=${TWILIO_DEFAULT_COUNTRY_CODE:+34}

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
